<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Samoloty</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #0a2a5e;
        color: #ffffff;
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        line-height: 1.6;
      }

      h1 {
        text-align: center;
        font-size: 2.5em;
        border-bottom: 3px solid #ffffff;
        padding-bottom: 10px;
      }

      h2 {
        background-color: #ffffff;
        color: #0a2a5e;
        padding: 8px 15px;
        border-radius: 6px;
        font-size: 1.3em;
      }

      ul {
        list-style-type: square;
      }

      li {
        margin-top: 15px;
        font-weight: bold;
      }

      img {
        display: block;
        margin: 8px 0 15px 0;
        border: 3px solid #ffffff;
        border-radius: 6px;
      }

      hr {
        border: none;
        border-top: 2px solid #ffffff;
      }
    </style>
  </head>
  <body>
    <h1>Samoloty</h1>
    <br>
    <h2>Najpopularniejsze firmy produkujące samoloty:</h2>
    <ul>
      <li>Boeing</li>
      <li>Airbus</li>
    </ul>
    <br>
    <hr>
    <br>
    <h2>Największe samoloty świata:</h2>
    <ul>
      <li>Stratolaunch Roc</li>
      <img src="https://www.smartage.pl/wp-content/uploads/2017/06/7-1.jpg" alt="roc" height="100">
      <li>Antonow An-225</li>
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS7_781m6sV8l5Z7tXPQLtkriLerhulJfO7bRETRTZCWA&s=10" alt="antonov" height="100">
      <li>Airbus A380-800</li>
      <img src="https://readyfortakeoffbook.com/cdn/shop/articles/image-hero-Airbus-A380-800.webp?v=1773602257&width=1024" alt="airbus" height="100">
      <li>Boeing 747-8</li>
      <img src="https://upload.wikimedia.org/wikipedia/commons/1/18/Boeing_747-8_N747EX_First_Flight.jpg?utm_source=pl.wikipedia.org&utm_campaign=index&utm_content=original" alt="boeing" height="100">
    </ul>
    <br>
    <hr>
    <br>
    <h2>Tak wygląda produkcja airbusa A380</h2>
    <img  src="https://zbiam.pl/wp-content/uploads/2022/02/A380-1.png" alt="fabryka" height="100">
  </body>
</html>
